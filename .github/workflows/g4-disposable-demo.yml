name: G4-0F integrated source-bound disposable product path
on:
  pull_request:
    paths:
      - "research/g4_disposable_demo/**"
      - "research/g4_0f_demo/**"
      - "research/g4_0e_hardening/**"
      - "research/g4_source_binding/**"
      - "docs/goal/G4_0D*"
      - "docs/goal/G4_0F*"
      - ".github/workflows/g4-disposable-demo.yml"
permissions: { contents: read }
jobs:
  integrated:
    name: Actual PostgreSQL gates, old CO, R03 and Chromium demo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathwise_test
          POSTGRES_USER: pathwise_test
          POSTGRES_PASSWORD: synthetic-g4-demo-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-g4-demo-only@127.0.0.1:5432/pathwise_test
      DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-g4-demo-only@127.0.0.1:5432/pathwise_test
      G3_TEST_DATABASE_URL: postgresql://pathwise_test:synthetic-g4-demo-only@127.0.0.1:5432/pathwise_test
      G3_PG_CANDIDATE_FILE: ${{ github.workspace }}/.e2e/g4-integrated-pg-candidate.json
      G4_DEMO_TEST_DATABASE_URL: postgresql://pathwise_test:synthetic-g4-demo-only@127.0.0.1:5432/pathwise_test
      G4_DEMO_PYTHON: python
      G4_DEMO_MODULE: research.g4_0f_demo.server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -B -m pytest research/g4_trusted_boundary research/g4_real_co_interop research/g4_r03_admission research/g4_disposable_demo research/g4_source_binding research/g4_0f_demo research/g3_choice_protocol apps/api/tests/test_overnight_r03.py -q -ra --tb=short
      - run: npm install --global npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: research/g4_disposable_demo/web
      - run: npm run build
        working-directory: research/g4_disposable_demo/web
      - run: npx vitest run src/source-contract.test.ts
        working-directory: research/g4_disposable_demo/web
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: research/g4_disposable_demo/web
      - run: npm run test:browser
        working-directory: research/g4_disposable_demo/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-source-bound-demo-evidence
          path: research/g4_disposable_demo/web/test-results/**/integrated_source_audit.png
          if-no-files-found: ignore
