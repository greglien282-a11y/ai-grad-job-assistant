name: G4-0B real legacy CO interoperability
on:
  pull_request:
    paths:
      - "research/g4_real_co_interop/**"
      - "docs/goal/G4_0B*"
      - ".github/workflows/g4-real-co-interop.yml"
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathwise_test
          POSTGRES_USER: pathwise_test
          POSTGRES_PASSWORD: synthetic-g4-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-g4-test-only@127.0.0.1:5432/pathwise_test
      DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-g4-test-only@127.0.0.1:5432/pathwise_test
      G3_TEST_DATABASE_URL: postgresql://pathwise_test:synthetic-g4-test-only@127.0.0.1:5432/pathwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -B -m pytest research/g4_real_co_interop -q -ra
