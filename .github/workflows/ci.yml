name: Pathwise application checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: FastAPI / pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathwise_test
          POSTGRES_USER: pathwise_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-ci-password@localhost:5432/pathwise_test
      TEST_DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-ci-password@localhost:5432/pathwise_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m app.cleanup_idempotency
      - run: python -m pytest -q -ra

  web:
    name: React / TypeScript build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm 10.9.x has intermittently failed dependency resolution with "edgesOut".
      - name: Use current npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build

  e2e:
    name: Real Chromium / FastAPI / PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-e2e-service-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_ADMIN_PASSWORD: synthetic-e2e-service-password
      PATHWISE_E2E_PYTHON: python
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ../api/requirements.txt
      - run: npm install --global npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium --only-shell
      - run: python e2e/ci_database.py
      - run: npm run e2e:preflight
      - run: npm run test:e2e:types
      - run: npm run test:e2e
      # No trace, HAR, service logs, private config, downloads or HTML reports.
      - name: Synthetic UI screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-e2e-screenshots
          path: |
            apps/web/test-results/**/desktop_workspace.png
            apps/web/test-results/**/mobile_workspace.png
            apps/web/test-results/**/home.png
            apps/web/test-results/**/discovery_desktop.png
            apps/web/test-results/**/discovery_mobile.png
            apps/web/test-results/**/discovery_zoom.png
          if-no-files-found: ignore
          retention-days: 7
