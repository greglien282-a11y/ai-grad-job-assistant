name: Pathwise application checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: FastAPI / pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathwise_test
          POSTGRES_USER: pathwise_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-ci-password@localhost:5432/pathwise_test
      TEST_DATABASE_URL: postgresql+psycopg://pathwise_test:synthetic-ci-password@localhost:5432/pathwise_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q -ra

  web:
    name: React / TypeScript build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm 10.9.x has intermittently failed dependency resolution with "edgesOut".
      - name: Use current npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
