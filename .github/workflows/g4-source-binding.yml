name: G4-0A authenticated source binding follow-up
on:
  pull_request:
    paths:
      - "research/g4_source_binding/**"
      - "docs/research/G4_SOURCE_BINDING.md"
      - ".github/workflows/g4-source-binding.yml"
permissions: { contents: read }
jobs:
  postgres:
    name: Real source substitution and authenticated ingress boundary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathwise_g3
          POSTGRES_USER: pathwise_test
          POSTGRES_PASSWORD: synthetic-g4-source-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_g3"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      G3_TEST_DATABASE_URL: postgresql://pathwise_test:synthetic-g4-source-only@127.0.0.1:5432/pathwise_g3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - run: python -B -m pytest research/g4_source_binding research/g4_trusted_boundary -q -ra
