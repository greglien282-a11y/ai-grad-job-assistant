name: G4-0E transaction and source defensive evidence
on:
  pull_request:
    paths: ['research/g4_0e_hardening/**', 'research/g4_source_binding/**', 'docs/research/G4_0E_TRANSACTION_AND_SOURCE.md', '.github/workflows/g4-0e-hardening.yml']
permissions: { contents: read }
jobs:
  postgres-evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pathwise_g3, POSTGRES_USER: pathwise_test, POSTGRES_PASSWORD: synthetic-g4-e-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pathwise_test -d pathwise_g3"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      G3_TEST_DATABASE_URL: postgresql://pathwise_test:synthetic-g4-e-only@127.0.0.1:5432/pathwise_g3
      G4_0E_EVIDENCE_FILE: ${{ github.workspace }}/.e2e/g4-0e-evidence.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'pytest>=8,<10'
      - run: python -B -m pytest research/g4_0e_hardening research/g4_source_binding research/g4_trusted_boundary -q -ra --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-0e-actual-transaction-evidence
          path: .e2e/g4-0e-evidence.jsonl
          if-no-files-found: ignore
